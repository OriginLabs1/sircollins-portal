name: Android

# Builds the signed TWA on a version tag and attaches it to a GitHub Release.
# GitHub Releases is the distribution source of truth: Obtainium and Uptodown
# read from it. Google Play is intentionally not involved.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of android/keystore/release.jks
#   ANDROID_KEYSTORE_PASSWORD store password (also used as key password)
#   ANDROID_KEY_ALIAS         key alias, e.g. sircollins
#
# Create a release by pushing a tag: git tag v0.0.2 && git push origin v0.0.2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build signed APK and bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          apksigner verify --print-certs "$APK"

      - name: Collect artifacts
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/*.apk ../artifacts/sir-collins-portal.apk
          cp app/build/outputs/bundle/release/*.aab ../artifacts/sir-collins-portal.aab

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sir Collins Portal ${{ github.ref_name }}
          body: |
            Sir Collins Portal for Android — the same living portal, installed.

            **Install:** download `sir-collins-portal.apk` below and open it.
            **Updates:** add `https://github.com/OriginLabs1/sircollins-portal` to
            [Obtainium](https://github.com/ImranR98/Obtainium) to receive each
            new release automatically.

            The app is a Trusted Web Activity: the content you see is the live
            portal at https://sircollins.coreconcept1.net, so copy and features
            update without reinstalling.
          files: |
            artifacts/sir-collins-portal.apk
            artifacts/sir-collins-portal.aab
          draft: false
          prerelease: false

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/*
